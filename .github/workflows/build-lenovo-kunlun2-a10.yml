name: Build Lenovo Z6 Lite / K10 Note (kunlun2, Stock Android 10)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "lenovo_kunlun2"
  DEVICE_CODENAME: "kunlun2"

  # 内核 Makefile 在 clang + aarch64-linux-android- 前缀下强制要求 CLANG_TRIPLE，
  # 不设就报 "Clang with Android --target detected. Did you specify CLANG_TRIPLE?"。
  # 官方 build-google-pixel-3a-lineageos22-a15.yml 用的就是这两行。
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # Ultra119/kernel_lenovo_sdm710 - kernel source for kunlun2 / kunlun2_row / jd2019
  # branch eleven = Linux 4.9.268 (closest LTS branch to the stock 4.9.186)
  KERNEL_SOURCE: "https://github.com/Ultra119/kernel_lenovo_sdm710.git"
  KERNEL_BRANCH: "eleven"

  # The 4.9.268 tree rejects GCC 4.9 (include/linux/compiler-gcc.h requires >= 5.1),
  # so clang must drive the build. Compiler choice does not affect kernel ABI.
  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "kunlun2_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "stock_a10"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  # kunlun2 stock vendor partition ships ~30 out-of-tree .ko built against 4.9.186.
  # A 4.9.268 kernel rejects them (vermagic mismatch), so pack our rebuilt modules too.
  PACK_KMODULES: "true"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # This kernel has no CONFIG_KPROBES (verified from /proc/config.gz),
  # so the manual syscall hook is the only viable method.
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # kunlun2 keeps its DTBs in the dtbo partition, but the boot image uses a
  # header v2 blob with dtb_size=0, i.e. the DTB is appended to the kernel
  # (Image.gz-dtb). Do NOT let the packer drop it or the device loses drivers.
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Lenovo Z6 Lite / K10 Note (kunlun2, Stock Android 10)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        run: |
          # No kprobe in this kernel -> syscall hook, no manual hook patch needed.

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # KernelSU syscall hook
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> ./arch/arm64/configs/kunlun2_defconfig
          # SELinux rwlock must not be static for KernelSU to hook it
          sed -i 's/^static DEFINE_RWLOCK(policy_rwlock);$/DEFINE_RWLOCK(policy_rwlock);/' security/selinux/ss/services.c
          # Silence the very chatty 4.9 tree
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile

          # --- HOST TOOLS FIX (GCC >= 10) ---
          # This 4.9 tree relies on pre-GCC-10 tentative-definition merging for
          # dtc's yylloc. Ubuntu runners ship GCC >= 10 where -fno-common is the
          # default, so linking scripts/dtc-aosp/dtc-aosp dies with:
          #   multiple definition of `yylloc'  (dtc-parser.tab.o vs dtc-lexer.lex.o)
          # HOSTCFLAGS feeds KBUILD_HOSTCFLAGS in 4.9; set both to be safe.
          echo "[+] Allowing common symbols in host tools (-fcommon)"
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile

          # --- SukiSU builtin sulog bug ---
          # With CONFIG_KSU_SUSFS *unset*, the in-tree ksu_sulog_capture()
          # takes `const struct user_arg_ptr argv` BY VALUE (event.c:289), while
          # this tree also defines USER_ARG_NULL as a POINTER:
          #   event.c:379  ksu_sulog_capture(... USER_ARG_NULL, gfp);
          # clang: passing 'struct user_arg_ptr *' to parameter of incompatible
          # type 'struct user_arg_ptr'; dereference with *
          # Dereference AT THE CALL SITE so this works no matter which variant
          # of USER_ARG_NULL the fetched SukiSU tree carries
          # (user_arg_null_ptr() or (&(struct user_arg_ptr){ 0 })).
          # Harmless: GRANT_ROOT sets should_skip_copy and never reads argv.
          echo "[+] Fixing SukiSU sulog USER_ARG_NULL for non-SUSFS build"
          sed -i 's/USER_ARG_NULL, gfp)/*(USER_ARG_NULL), gfp)/' drivers/kernelsu/sulog/event.c
          grep -n "USER_ARG_NULL" drivers/kernelsu/sulog/event.c || true

          # --- SukiSU builtin non-GKI selinux_hide bug ---
          # kernel/ksu.c only pulls in feature/selinux_hide.c when
          #   #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
          # but runtime/ksud.c calls three of its functions unconditionally
          # (ksud.c:57, :95, :219/:291). On this 4.9 tree the final vmlinux link
          # therefore fails with:
          #   undefined reference to 'ksu_selinux_hide_handle_second_stage'
          #   undefined reference to 'ksu_selinux_hide_handle_post_fs_data'
          # Provide empty inlines for < 5.10; the real ones still win on >= 5.10.
          echo "[+] Adding <5.10 stubs for SukiSU selinux_hide"
          if [ -f drivers/kernelsu/feature/selinux_hide.h ]; then
            grep -q 'ksu_selinux_hide_handle_post_fs_data(void) {}' drivers/kernelsu/feature/selinux_hide.h || \
              printf '\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\nstatic inline void ksu_selinux_hide_init(void) {}\nstatic inline void ksu_selinux_hide_exit(void) {}\nstatic inline void ksu_selinux_hide_drop_backup_if_unused(void) {}\nstatic inline void ksu_selinux_hide_handle_second_stage(void) {}\nstatic inline void ksu_selinux_hide_handle_post_fs_data(void) {}\n#endif\n' >> drivers/kernelsu/feature/selinux_hide.h
            tail -10 drivers/kernelsu/feature/selinux_hide.h
          fi

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
