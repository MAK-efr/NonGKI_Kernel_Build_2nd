name: Build Lenovo Z6 Lite / K10 Note (kunlun2) - DEAN native KSU

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "lenovo_kunlun2"
  DEVICE_CODENAME: "kunlun2"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # deanlancer/msm-4.9-kunlun2 @ android-s already carries, baked into the
  # kernel source, the old non-GKI KernelSU manual hooks:
  #   fs/open.c:376     ksu_handle_faccessat(&dfd, &filename, &mode, NULL)
  #   fs/stat.c:99      ksu_handle_stat(&dfd, &filename, &flag)
  #   fs/exec.c:1692    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags)
  #   drivers/input/input.c:386  ksu_handle_input_handle_event(&type, &code, &value)
  # Those calls are plain (no #ifdef CONFIG_KSU), so the factory's
  # clean_hook.sh cannot strip them: they MUST be resolved by a driver that
  # defines exactly these symbols.  That is the tree's own drivers/kernelsu
  # (sucompat.c defines ksu_handle_faccessat/ksu_handle_stat/...), which
  # clean_hook.sh deletes and the factory then replaces with SukiSU.
  # SukiSU v4.2.0 does not even compile on 4.9:
  #   policy/app_profile.c:57:29: error: no member named 'mode' in 'struct seccomp'
  # So this workflow puts the tree's ORIGINAL driver back after build-ready ran.
  KERNEL_SOURCE: "https://github.com/deanlancer/msm-4.9-kunlun2.git"
  KERNEL_BRANCH: "android-s"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "kunlun2_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # keep AUTO_GET=true so build-ready leaves a valid drivers/kernelsu behind for
  # its own "SukiSU-Ultra Fixed" step; our extra step swaps in dean's driver.
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "dean3"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "true"

  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Lenovo kunlun2 DEAN native KSU
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # --- 1. put the tree's OWN KernelSU driver back ------------------
          # clean_hook.sh deleted drivers/kernelsu; build-ready then installed
          # SukiSU there.  SukiSU v4.2.0 cannot compile on 4.9 at all and its
          # hook symbol names do not match the hooks baked into this tree.
          echo "[-] current drivers/kernelsu:"; ls -la drivers/kernelsu 2>/dev/null | head -5 || true
          rm -rf drivers/kernelsu
          git checkout -- drivers/kernelsu
          echo "[+] restored dean in-tree driver:"; ls drivers/kernelsu | head -20
          if [ ! -f drivers/kernelsu/sucompat.c ]; then echo "[-] restore failed"; exit 1; fi
          grep -q 'ksu_handle_faccessat' drivers/kernelsu/sucompat.c && echo "[+] sucompat defines the tree hook symbols"
          grep -q 'kernelsu' drivers/Makefile && echo "[+] drivers/Makefile already lists kernelsu"

          # --- 2. KernelSU on, vanilla-off --------------------------------
          echo "CONFIG_KSU=y" >> arch/arm64/configs/kunlun2_defconfig
          echo "# CONFIG_KSU_DEBUG is not set" >> arch/arm64/configs/kunlun2_defconfig
          grep -n 'CONFIG_KSU' arch/arm64/configs/kunlun2_defconfig | tail -5 || true

          # --- 3. host toolchain fixes ------------------------------------
          # Silence the very chatty 4.9 tree
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile
          # HOST TOOLS FIX (GCC >= 10): 4.9's scripts/dtc-aosp relies on
          # pre-GCC-10 tentative-definition merging for yylloc.
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile
          # DTB: skip the whole dtbs target (stock dtb section is what we use)
          sed -i 's/^KBUILD_DTBS.*/KBUILD_DTBS :=/' arch/arm64/Makefile
          grep -n '^KBUILD_DTBS' arch/arm64/Makefile || true

          # --- 4. 32-bit vDSO fix -----------------------------------------
          # vdso32/Makefile uses $(CC) --target=arm32 -no-integrated-as while
          # CROSS_COMPILE_ARM32 is empty on this runner, so clang falls back to
          # the host /usr/bin/as which rejects '-EL'.  arch/arm64/Makefile gates
          # the vdso32 build on CONFIG_VDSO32, which is only set when
          # CONFIG_COMPAT_VDSO=y, so turning COMPAT_VDSO off drops vdso32
          # entirely (32-bit app compat stays).
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/kunlun2_defconfig
          grep -n 'COMPAT_VDSO' arch/arm64/configs/kunlun2_defconfig || true

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📋 Dump effective kernel config
        if: always()
        run: |
          cp device_kernel/out/.config "$GITHUB_WORKSPACE/kunlun2_dean3.config" 2>/dev/null || echo "no .config"
          find device_kernel/out -name '*.ko' 2>/dev/null | sort > "$GITHUB_WORKSPACE/kunlun2_dean3_modules.txt" || true
          echo "[+] .ko count: $(wc -l < "$GITHUB_WORKSPACE/kunlun2_dean3_modules.txt")"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODULE_SIG|^CONFIG_LOCALVERSION|^CONFIG_KSU|COMPAT_VDSO' "$GITHUB_WORKSPACE/kunlun2_dean3.config" || true

      - name: 📤 Upload config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunlun2-dean3-config
          path: |
            kunlun2_dean3.config
            kunlun2_dean3_modules.txt
          if-no-files-found: warn

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
