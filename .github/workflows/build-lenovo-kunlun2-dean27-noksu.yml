name: Build Lenovo Z6 Lite / K10 Note (kunlun2) - dean27-noksu = dean27-ksu EXCEPT KernelSU/SukiSU is NOT compiled in (CONFIG_KSU is not set). Stock defconfig, deanlancer tree with SUBLEVEL 186, pure GCC 4.9. Control build for whether the KSU hook set itself kills the early boot.

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "lenovo_kunlun2"
  DEVICE_CODENAME: "kunlun2"

  # dean15 = dean10 EXCEPT the compiler.
  #
  # Fact: the stock kernel was built with
  #   (buildslave@byws33) (gcc version 4.9.x 20150123 (prerelease) (GCC) )
  # while every kernel we produced (dean4..dean10, and the Ultra119 vanilla
  # bisection) was built with
  #   (Android (7284624, based on r416183b) Clang version ...
  #
  # dean10 is the first build that is byte-correct everywhere else
  # (SUBLEVEL=186, LOCALVERSION="-perf+", vermagic matches, correct boot header
  # and DTB, ABL verifies+decompresses it and hands over) yet the device still
  # dies with ZERO console output and ZERO pstore record, i.e. before
  # console_init (pstore console registers at 0.229 s on the stock kernel).
  #
  # So the last untested variable is the toolchain itself.  Empty CLANG_SOURCE
  # makes build-process take the `elif KERNEL_ARCH == arm64` path:
  #     export "$GCC_64"        # CROSS_COMPILE=aarch64-linux-android-
  #     BUILD_PROCESS           # no arg -> BUILD_CLANG="" -> CC is NOT overridden
  #     make O=out ARCH=arm64 ...        (pure GCC)
  # Both CUSTOM_CMDS (CLANG_TRIPLE) and EXTRA_CMDS (LD_LIBRARY_PATH) exist only
  # for clang, so they are cleared as well.
  CUSTOM_CMDS: ""
  EXTRA_CMDS: ""

  # dean6 = dean5 + the Kconfig abort fix.
  # run 36995289637 (dean5) died at `scripts/kconfig/conf --silentoldconfig`:
  #   .config:525:warning: symbol value '' invalid for LITTLE_CPU_MASK
  #   .config:526:warning: symbol value '' invalid for BIG_CPU_MASK
  #   Bitmask of available LITTLE CPUs (LITTLE_CPU_MASK) [] (NEW) aborted!
  # In the 4.9.337 tree both are `int` WITHOUT a default
  # (arch/arm64/Kconfig:705-716), so `make kunlun2_defconfig` writes them as
  # empty -> silentoldconfig calls the value invalid -> it enters the
  # "Restart config" prompt loop -> stdin is not a tty -> abort.
  # The tree's own defconfig carries the intended values:
  #   CONFIG_LITTLE_CPU_MASK=63   (0x3F = CPUs 0-5, the six A55)
  #   CONFIG_BIG_CPU_MASK=192     (0xC0 = CPUs 6-7, the two A75)
  # General fix: seed with the stock config, then append every entry the
  # tree's own defconfig has and stock does not - which is exactly the set of
  # symbols that are NEW in 4.9.337 (stock has no opinion about them, and the
  # tree's build uses its own values). Our overrides are appended last, so
  # they always win over anything inherited from either source.
  KERNEL_SOURCE: "https://github.com/deanlancer/msm-4.9-kunlun2.git"
  KERNEL_BRANCH: "android-s"

  # no clang at all for dean15
  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "dean27noksu"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Lenovo kunlun2 dean15 pure GCC 4.9
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          D=arch/arm64/configs/defconfig
          S=$GITHUB_WORKSPACE/stock-kunlun2.config

          # --- 0. seed with the DEVICE'S OWN stock config -------------------
          echo "[+] base = the tree's OWN defconfig: $(wc -l < $D) lines"

          # --- 0b. module-ABI extras: symbols the stock vendor modules import --
          # (dean9 uses the tree's own defconfig as the base, because dean8 proved
          #  a config merged from the stock dump enables callers whose providers
          #  this source tree does not have -> vmlinux link errors:
          #  interrupt_stats, cec_*, gsi_debugfs_init, dump_page,
          #  pageflag_names, qtaguid_debug_mask, ...)
          echo "CONFIG_KALLSYMS=y" >> $D
          echo "CONFIG_KALLSYMS_ALL=y" >> $D
          echo "CONFIG_STACKTRACE=y" >> $D
          echo "CONFIG_FTRACE=y" >> $D
          echo "CONFIG_TRACING=y" >> $D
          echo "CONFIG_EVENT_TRACING=y" >> $D
          echo "CONFIG_IPC_LOGGING=y" >> $D
          echo "CONFIG_SCHED_CORE_CTL=y" >> $D
          echo "CONFIG_CC_STACKPROTECTOR=y" >> $D
          echo "CONFIG_CC_STACKPROTECTOR_STRONG=y" >> $D
          echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set" >> $D
          echo "# CONFIG_CC_STACKPROTECTOR_NONE is not set" >> $D
          # --- dean14 proved the REAL cause of "compiler does not support
          # -fstack-protector*": tree Makefile:866-871 does
          #     KBUILD_CFLAGS += -ftrivial-auto-var-init=zero
          # when CONFIG_INIT_STACK_ALL_ZERO=y, and GCC 4.9 does not know that
          # option ("real-...gcc: error: unrecognized command line option").
          # cc-option probes pass $(KBUILD_CFLAGS) through, so EVERY probe
          # failed and prepare-compiler-check blamed the stack-protector flag.
          # This is a clang-only hardening knob - turn it off for GCC builds.
          echo "CONFIG_INIT_STACK_NONE=y" >> $D
          echo "# CONFIG_INIT_STACK_ALL_ZERO is not set" >> $D
          echo "# CONFIG_INIT_STACK_ALL_PATTERN is not set" >> $D
          # dean17's DIAG proved the config route is not enough: the probe
          # still reported DIAG-BADTOKEN=[-ftrivial-auto-var-init=zero] with
          # both "is not set" lines above already applied.  Remove the option
          # at the Makefile level so GCC never receives it, whatever the
          # resolved .config says.  KBUILD_CFLAGS is simply-expanded (`:=` at
          # Makefile:409), so `+= $(call cc-option, ...)` is evaluated right
          # there and the option is dropped when the compiler rejects it.
          sed -i 's|^\(KBUILD_CFLAGS[[:space:]]*+=[[:space:]]*\)-ftrivial-auto-var-init=zero[[:space:]]*$|\1$(call cc-option, -ftrivial-auto-var-init=zero)|' Makefile
          sed -i 's|^\(KBUILD_CFLAGS[[:space:]]*+=[[:space:]]*\)-ftrivial-auto-var-init=pattern[[:space:]]*$|\1$(call cc-option, -ftrivial-auto-var-init=pattern)|' Makefile
          echo "=== MAKE-DIAG: trivial-auto-var-init lines after guarding ==="
          grep -n 'trivial-auto-var-init' Makefile
          grep -q 'cc-option, -ftrivial-auto-var-init=zero' Makefile || {
            echo "[-] Makefile:870 was not guarded"; exit 1; }
          grep -q 'cc-option, -ftrivial-auto-var-init=pattern' Makefile || {
            echo "[-] Makefile:862 was not guarded"; exit 1; }
          echo "[+] both stack-init flags are cc-option guarded"
          echo "CONFIG_DEBUG_FS=y" >> $D
          echo "CONFIG_OVERLAY_FS=y" >> $D
          # code this tree cannot build or does not provide
          echo "# CONFIG_CPU_BOOST is not set" >> $D
          echo "# CONFIG_DRM_DP_CEC is not set" >> $D
          echo "# CONFIG_NETFILTER_XT_MATCH_QTAGUID_EXT is not set" >> $D
          # --- 0d. move back TOWARDS the vendor's stock config ---------------
          # The vendor's own /proc/config.gz dump and this tree's defconfig
          # disagree on 626 symbols.  The reboot/panic group is why every
          # earlier failure was blind: with PANIC_TIMEOUT=1 a panic reboots
          # the board before pstore can be written, and QCOM_MEMORY_DUMP_V2=n
          # throws away the ramdump as well.  Restore the stock values so the
          # next crash leaves evidence.
          echo "CONFIG_PANIC_TIMEOUT=5" >> $D
          echo "CONFIG_QCOM_MEMORY_DUMP_V2=y" >> $D
          # stock values for symbols that matter during early bring-up
          echo "CONFIG_CPU_BOOST=y" >> $D
          echo "# CONFIG_SCHED_SMT is not set" >> $D
          echo "# CONFIG_SCHED_CORE_ROTATE is not set" >> $D
          echo "# CONFIG_PM_AUTOSLEEP is not set" >> $D
          echo "CONFIG_CGROUP_SCHED=y" >> $D
          echo "CONFIG_FAIR_GROUP_SCHED=y" >> $D
          echo "CONFIG_RT_GROUP_SCHED=y" >> $D
          echo "CONFIG_SCHED_AUTOGROUP=y" >> $D
          # --- 0f. SECCOMP: the SukiSU driver needs the real struct seccomp -
          # drivers/kernelsu/policy/app_profile.c reads current->seccomp.mode
          # and current->seccomp.filter.  In this 4.9 tree those members exist
          # ONLY under CONFIG_SECCOMP (include/linux/seccomp.h:26-29); without
          # it the header falls back to "struct seccomp { };" and dean22 died:
          #   error: 'struct seccomp' has no member named 'mode'   (app_profile.c:57)
          #   error: 'struct seccomp' has no member named 'filter' (app_profile.c:88)
          # The vendor's own config has CONFIG_SECCOMP=y (line 535),
          # CONFIG_SECCOMP_FILTER=y (253) and HAVE_ARCH_SECCOMP_FILTER=y (252),
          # so this is a return to stock, not an experiment.
          echo "CONFIG_SECCOMP=y" >> $D
          echo "CONFIG_SECCOMP_FILTER=y" >> $D
          echo "CONFIG_HAVE_ARCH_SECCOMP_FILTER=y" >> $D

          # --- 0g. STOCK-matching crash forensics ---------------------------
          # dean4..dean24 all died silently: no serial, no pstore entry, and the
          # next boot reports PON reason 0x81 (PMIC watchdog). The stock config
          # keeps PANIC_TIMEOUT=5 and the ramoops/pstore console capture that
          # produced _lenovo/out/pstore-console-ramoops-0.txt (257882 B) -- and
          # ramoops survives reboots on this device, so a graceful panic IS
          # readable afterwards. Our tree's defconfig has PANIC_TIMEOUT=1 and the
          # factory yml leaves CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC=y, i.e. the
          # PMIC bites immediately and the console ring never gets flushed.
          echo "CONFIG_PANIC_TIMEOUT=5" >> $D
          echo "# CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC is not set" >> $D
          echo "CONFIG_PSTORE=y" >> $D
          echo "CONFIG_PSTORE_RAM=y" >> $D
          echo "CONFIG_PSTORE_CONSOLE=y" >> $D
          echo "# CONFIG_PSTORE_PMSG is not set" >> $D
          # dean26: CONFIG_DEBUG_KERNEL=y is BANNED for this tree.  It
          # re-exposes drivers/platform/msm/gsi/gsi.c:3189-3191
          #     #ifdef CONFIG_DEBUG_KERNEL
          #             gsi_debugfs_init();
          #     #endif
          # while gsi.h:318 only ever supplies a bare prototype
          #     static inline void gsi_debugfs_init(void);
          # with no body in that translation unit, so -std=gnu89 inline
          # semantics hard-fail:
          #   gsi.h:318:20: error: inlining failed in call to
          #     always_inline 'gsi_debugfs_init': function body not available
          #   gsi.c:3190:2: error: called from here
          # The same call site already bit the stock-config merge build:
          #   _lenovo/gh/diag17/log-110805857883.txt:9824
          #   job "Lenovo kunlun2 DEAN6 stock-config + tree merge" (dean8)
          #   .../gsi/gsi.c:3190: undefined reference to `gsi_debugfs_init'
          #   (along with interrupt_stats / smd_edge_to_* / cec_* / dump_page
          #    / pageflag_names / gfpflag_names / vmaflag_names /
          #    qtaguid_debug_mask) -- that build had DEBUG_KERNEL=y from the
          # stock dump, and the cure was to stop using the stock base.
          # DETECT_HUNG_TASK / BOOTPARAM_HUNG_TASK_PANIC / PANIC_ON_OOPS all
          # live under `menuconfig DEBUG_KERNEL`, so they are dropped too.
          echo "[+] tree defconfig + ABI extras: $(wc -l < $D) lines"
          # dean27: the stock defconfig HAS CONFIG_DEBUG_KERNEL=y (the crippled
          # kunlun2_defconfig did not), so ban it here exactly like dean26 did.
          echo "# CONFIG_DEBUG_KERNEL is not set" >> $D
          # dean27: kernel/sched/tune.c uses the STUNE_ASSIST-only wrappers in
          # files[] unguarded (tree bug), so STUNE_ASSIST must be on.
          echo "CONFIG_STUNE_ASSIST=y" >> $D
          echo "CONFIG_DYNAMIC_STUNE_BOOST=y" >> $D

          # --- 0c. the tree's net/sctp/Makefile has a typo ------------------
          # 'stcp-$(CONFIG_DEBUG_KERNEL) += debug.o' - the misspelled prefix
          # means debug.o is never built, and debug.o is what defines
          # sctp_state_tbl / sctp_evttype_tbl / sctp_status_tbl / sctp_cname /
          # sctp_tname / sctp_oname / sctp_pname -> vmlinux link fails with
          # "undefined reference to `sctp_state_tbl'".  Build it explicitly.
          echo 'sctp-y += debug.o' >> net/sctp/Makefile
          grep -n 'debug.o' net/sctp/Makefile

          # --- 0d. bypass the arm64 "GCC 5.1 or newer" gate ----------------
          # This rebased tree carries upstream's blanket arm64 gate
          # (include/linux/compiler-gcc.h, GCC PR63293):
          #   #elif defined(CONFIG_ARM64) && GCC_VERSION < 50100 && !defined(__clang__)
          #   # error Sorry, your version of GCC is too old - please use 5.1 or newer.
          # The vendor shipped THIS device's kernel built with exactly the AOSP
          # gcc 4.9 toolchain we are using (the stock banner reads
          # "gcc version 4.9.x 20150123 (prerelease)"), so for us the gate is a
          # rebase artifact rather than a real limitation.  Neutralise the branch
          # CONDITION only (`#elif 0`): the #error body is simply never taken and
          # nothing else in the header changes.
          sed -i 's|^#elif .*GCC_VERSION < 50100.*$|#elif 0 /* dean26: the vendor built this kernel with the AOSP gcc 4.9 toolchain */|' include/linux/compiler-gcc.h
          echo "=== MAKE-DIAG: compiler-gcc.h version gates ==="
          grep -n 'GCC_VERSION < 50100\|use 5.1 or newer\|#elif 0\|GCC_VERSION < 30200' include/linux/compiler-gcc.h
          grep -q '#elif 0' include/linux/compiler-gcc.h || {
            echo "[-] failed to bypass the arm64 GCC 5.1 gate"
            grep -n 'GCC_VERSION' include/linux/compiler-gcc.h
            exit 1; }
          echo "[+] arm64 GCC 5.1 gate bypassed"
          echo "=== scan: other GCC version gates in the tree ==="
          grep -rn 'GCC_VERSION < 5\|GCC_VERSION <= 5\|use 5.1 or newer\|gcc 5.1' \
            include/linux/compiler*.h arch/arm64/Makefile arch/arm64/Kconfig 2>/dev/null | head -30 || true

          # --- 0e. the GCC path has no arm64 crypto arch flags -------------
          # arch/arm64/Makefile:146-149 adds the crc/crypto extensions for
          # clang ONLY:
          #     ifeq ($(cc-name),clang)
          #     KBUILD_CFLAGS += $(call cc-disable-warning, asm-operand-widths)
          #     KBUILD_CFLAGS += -mcpu=cortex-a75+crypto+crc+nodotprod
          #     endif
          # arch/arm64/crypto/crc32-arm64.c always emits crc32* instructions
          # and arch/arm64/crypto/Makefile carries no per-file arch flag for
          # it, so dean19 died there:
          #     Error: selected processor does not support `crc32x w0,w0,x5'
          # GCC 4.9 knows no cortex-a75 -mcpu, but it does know the armv8-a
          # "crc"/"crypto" extensions.  Probe with a REAL assembler test (the
          # crc32x instruction itself) and require the result - a silent no-op
          # would only move the same failure back into the build.
                    # CROSS_COMPILE is NOT exported in this step, so dean21's probe ran
          # the runner's HOST x86 gcc (hence the x86 -march value list).
          # GCC_64 carries it as "CROSS_COMPILE=<ws>/gcc-64/bin/aarch64-linux-android-".
          if [ -n "$GCC_64" ]; then export "$GCC_64"; fi
          CCX="${CROSS_COMPILE}gcc"
          if ! command -v "$CCX" >/dev/null 2>&1; then
            CCX="$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android-gcc"
          fi
          echo "[i] crc probe compiler: $CCX"
          "$CCX" --version 2>&1 | head -1 || true
          "$CCX" -dumpmachine 2>&1 | head -1 || true
          "$CCX" -dumpmachine 2>/dev/null | grep -q aarch64 || {
            echo "[-] the crc probe is not using an aarch64 compiler: $CCX"; exit 1; }
          printf '.text\ncrc32x w0, w0, x5\ncrc32w w0, w0, w2\ncrc32b w0, w0, w1\n' > /tmp/crcprobe.S
          cat /tmp/crcprobe.S
          CRC_FLAG=""
          for f in "-march=armv8-a+crc+crypto" "-march=armv8-a+crypto+crc" \
                   "-march=armv8-a+crc" "-march=armv8-a+crypto" \
                   "-mcpu=cortex-a53+crc" "-mcpu=cortex-a57+crc" \
                   "-Wa,-march=armv8-a+crc"; do
            if "$CCX" $f -c /tmp/crcprobe.S -o /tmp/crcprobe.o 2>/tmp/crcprobe.err; then
              CRC_FLAG="$f"; break
            fi
            echo "[i] $CCX rejects $f:"; head -5 /tmp/crcprobe.err || true
          done
          if [ -z "$CRC_FLAG" ]; then
            echo "[-] $CCX cannot assemble crc32x; its valid -march list follows:"
            "$CCX" -march=armv8-a+crc+crypto -c -x c /dev/null -o /tmp/x.o 2>&1 | head -4 || true
            exit 1
          fi
          echo "[+] GCC arm64 crc/crypto arch flag: $CRC_FLAG"
          echo "KBUILD_CFLAGS += $CRC_FLAG" >> Makefile
          echo "=== Makefile tail ==="
          tail -3 Makefile
          echo "=== scan: every clang-only Makefile block in the tree ==="
          grep -rn 'cc-name),clang\|cc-name), clang' \
            --include=Makefile --include=Kbuild --include='*.mk' . 2>/dev/null | head -40 || true

          # --- 1. KEEP the SukiSU-Ultra driver build-ready installed --------
          # MAK-efr's clean_hook.sh removed the tree's old drivers/kernelsu and
          # setup.sh then cloned SukiSU-Ultra(builtin) to ./KernelSU and made
          # drivers/kernelsu a symlink to ./KernelSU/kernel.  dean15 used to run
          #   rm -rf drivers/kernelsu && git checkout -- drivers/kernelsu
          # here.  That restored the tree's OLD driver (git tracked it) and left
          # ./KernelSU orphaned -> dean15 compiled the WRONG driver, and the
          # sukisu_ultra_fixed.patch that build-ready applied to drivers/kernelsu
          # was thrown away with it.  Assert the symlink instead.
          if [ ! -L drivers/kernelsu ]; then
            echo "[-] drivers/kernelsu is not a symlink - build-ready did not install SukiSU"
            ls -ld drivers/kernelsu && ls -la drivers/kernelsu | head
            exit 1
          fi
          echo "[+] drivers/kernelsu -> $(readlink -f drivers/kernelsu)"
          if [ ! -f drivers/kernelsu/feature/selinux_hide.c ]; then
            echo "[-] SukiSU kernel feature/ tree not found behind the symlink"
            ls -la drivers/kernelsu | head -30
            exit 1
          fi
          for p in ksu.c Kconfig Makefile supercall hook include infra policy runtime; do
            if [ -e "drivers/kernelsu/$p" ]; then echo "[+] SukiSU/$p present"; else echo "[i] SukiSU/$p missing"; fi
          done
          grep -n kernelsu drivers/Makefile drivers/Kconfig || true
          echo "=== SukiSU driver file count ==="
          find -L drivers/kernelsu -name '*.c' | wc -l

          # --- 1b. SukiSU sulog/event.c: argument 3 must be a VALUE ---------
          # kernel/sulog/event.c:377 does  #define USER_ARG_NULL user_arg_null_ptr()
          # and :379 hands it to ksu_sulog_capture(), whose 3rd parameter is
          # declared BY VALUE as "const struct user_arg_ptr".  user_arg_null_ptr()
          # returns a POINTER, so dean22 died with
          #   ../drivers/kernelsu/sulog/event.c:379:15: error: incompatible type
          #   for argument 3 of 'ksu_sulog_capture'
          #   note: expected 'const struct user_arg_ptr' but argument is of type
          #         'struct user_arg_ptr *'
          # Pass a zero compound literal: same "no argv" meaning, exact type,
          # and no runtime dereference of anything.
          sed -i 's|ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp)|ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, (struct user_arg_ptr){0}, gfp)|' drivers/kernelsu/sulog/event.c
          echo "=== MAKE-DIAG: sulog grant_root capture call ==="
          grep -n 'ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT' drivers/kernelsu/sulog/event.c || true
          grep -q '(struct user_arg_ptr){0}, gfp)' drivers/kernelsu/sulog/event.c || {
            echo "[-] failed to fix the sulog USER_ARG_NULL call"
            sed -n '370,385p' drivers/kernelsu/sulog/event.c
            exit 1; }
          echo "[+] sulog grant_root call now passes a by-value user_arg_ptr"

          # --- 1c. 4.9 link fix: drop the 5.10-only selinux_hide calls ------
          # kernel/ksu.c:84-86 includes feature/selinux_hide.c ONLY when
          #   LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0), so on 4.9 the
          #   symbols ksu_selinux_hide_handle_post_fs_data and
          #   ksu_selinux_hide_handle_second_stage are never defined, yet
          #   runtime/ksud.c still calls them (dean23 died at the vmlinux link):
          #     drivers/built-in.o: In function `on_post_fs_data':
          #     undefined reference to `ksu_selinux_hide_handle_post_fs_data'
          #     drivers/built-in.o: In function `ksu_handle_execveat_ksud':
          #     undefined reference to `ksu_selinux_hide_handle_second_stage'
          # Call sites: ksud.c:57 (unguarded), :219 (inside #ifdef CONFIG_KSU_SUSFS,
          # not built here) and :291 (the non-SUSFS variant we DO build).
          # ksud.c:95 ksu_selinux_hide_drop_backup_if_unused() sits inside
          #   #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0) and is kept.
          # The factory patch sukisu_ultra_fixed.patch aims at these deletions but
          # its hunks are stale against the current `builtin` HEAD and are applied
          # with "patch --forward ... || true" + .rej cleanup, i.e. silently lost.
          sed -i '/^[[:space:]]*ksu_selinux_hide_handle_post_fs_data();[[:space:]]*$/d' drivers/kernelsu/runtime/ksud.c
          sed -i '/^[[:space:]]*ksu_selinux_hide_handle_second_stage();[[:space:]]*$/d' drivers/kernelsu/runtime/ksud.c
          echo "=== MAKE-DIAG: selinux_hide call sites left in ksud.c ==="
          grep -n 'ksu_selinux_hide_' drivers/kernelsu/runtime/ksud.c || true
          if grep -q '^[[:space:]]*ksu_selinux_hide_handle_post_fs_data();' drivers/kernelsu/runtime/ksud.c; then
            echo "[-] ksu_selinux_hide_handle_post_fs_data() call survived the sed"
            exit 1; fi
          if grep -q '^[[:space:]]*ksu_selinux_hide_handle_second_stage();' drivers/kernelsu/runtime/ksud.c; then
            echo "[-] ksu_selinux_hide_handle_second_stage() call survived the sed"
            exit 1; fi
          echo "[+] 5.10-only selinux_hide handle calls removed from ksud.c"
          # the guarded one must still be there
          grep -q 'ksu_selinux_hide_drop_backup_if_unused' drivers/kernelsu/runtime/ksud.c || {
            echo "[-] lost the version-guarded drop_backup_if_unused call"; exit 1; }
          echo "[+] the >=5.10-guarded drop_backup_if_unused call is intact"

          # --- 2. KernelSU on, vanilla-off --------------------------------
          # dean27-noksu control: SukiSU is NOT built (all its patch steps still run)
          echo "# CONFIG_KSU is not set" >> $D

          # --- 3. MODULE ABI: make the stock vendor modules load -----------
          # (a) release string must be exactly 4.9.186-perf+ : dean4 proved the
          #     build appends nothing on its own, so "+" goes in LOCALVERSION
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 186/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          echo 'CONFIG_LOCALVERSION="-perf+"' >> $D
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> $D
          # (b) our keyring does not hold the stock key: forced signature
          #     verification rejects every vendor module
          echo "# CONFIG_MODULE_SIG is not set" >> $D
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> $D
          echo "# CONFIG_MODULE_SIG_ALL is not set" >> $D
          # (c) a rebased 4.9.337 source cannot reproduce the stock genksyms
          #     CRCs, so drop the CRC check ...
          echo "# CONFIG_MODVERSIONS is not set" >> $D
          # ... but keep "modversions" in VERMAGIC_STRING so the version-magic
          #     gate still matches the vendor modules
          sed -i 's/MODULE_VERMAGIC_MODVERSIONS ""/MODULE_VERMAGIC_MODVERSIONS "modversions "/' include/linux/vermagic.h
          grep -n 'MODULE_VERMAGIC' include/linux/vermagic.h
          # (d) stock has APPENDED_DTB off: the bootloader supplies the stock
          #     dtb block plus dtbo overlays; an appended dtb would shadow them
          echo "# CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set" >> $D
          echo "# CONFIG_BUILD_ARM64_DT_OVERLAY is not set" >> $D

          # --- 4. int symbols with no default must never be empty ----------
          # (belt and braces on top of the tree merge)
          echo "CONFIG_LITTLE_CPU_MASK=63" >> $D
          echo "CONFIG_BIG_CPU_MASK=192" >> $D

          # --- 4b. options this tree cannot compile ------------------------
          # stock enables CPU_BOOST, but this tree's drivers/cpufreq/cpu-boost.c
          # does #include <linux/battery_saver.h>, which the tree does not have
          # (the tree's own defconfig keeps CPU_BOOST off for the same reason)
          echo "# CONFIG_CPU_BOOST is not set" >> $D
          # --- 4c. (dean26) no KernelSU version hack -----------------------
          # dean15 appended -DKSU_GIT_VERSION=1038 so the OFFICIAL KernelSU
          # manager v0.6.8 (version code 11238) would accept the tree's OWN
          # driver.  We now compile SukiSU-Ultra's driver, which carries its own
          # version scheme and is managed by the SukiSU Ultra manager, so that
          # hack is gone with the old driver.
          echo "[i] drivers/kernelsu is SukiSU-Ultra, no KSU_GIT_VERSION override"
          # --- 5. host toolchain fixes ------------------------------------
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile
          sed -i 's/^KBUILD_DTBS.*/KBUILD_DTBS :=/' arch/arm64/Makefile

          # --- 6. 32-bit vDSO fix -----------------------------------------
          echo "# CONFIG_COMPAT_VDSO is not set" >> $D

          # --- 6b. DEAN16 DIAGNOSTIC: name the real cc-option poison --------
          # tree Makefile:1257-1263 runs `cc-option -fstack-protector-strong',
          # and cc-option (Kbuild.include:113-126) passes the WHOLE
          #     $(KBUILD_CPPFLAGS) $(CC_OPTION_CFLAGS)
          # through to the compiler.  ONE token GCC 4.9 rejects makes EVERY
          # probe return empty, and the check then blames
          # -fstack-protector-strong, which this compiler demonstrably accepts
          # (dean15 self-test: PROBE[fstackstrong] rc=0).
          # So: (a) make the probe stop treating warning-class output as fatal,
          #     (b) hook a read-only dump in as a prerequisite so it runs BEFORE
          #         the fatal check, printing the exact expanded command line and
          #         probing every token on its own.
          cp scripts/Kbuild.include /tmp/Kbuild.include.dean26.bak
          sed -i 's|$(1) -Werror $(2)|$(1) -Werror -Wno-error $(2)|' scripts/Kbuild.include
          # dean27: kernel/cpuset.c guard for the unguarded
          # cpuset_write_resmask_assist() (struct cs_target lives under
          # #ifdef CONFIG_CPUSET_ASSIST, the function does not) -- keeps the
          # compiled config stock-identical.
          perl -0777 -i -pe 's/(static ssize_t cpuset_write_resmask_assist\(struct kernfs_open_file \*of,)/#ifdef CONFIG_CPUSET_ASSIST\n$1/; s/(\treturn cpuset_write_resmask\(of, tgt\.cpus, nbytes, off\);\n\})/$1\n#endif/' kernel/cpuset.c
          n=$(grep -c 'CONFIG_CPUSET_ASSIST' kernel/cpuset.c)
          echo "[+] cpuset.c CONFIG_CPUSET_ASSIST occurrences: $n (want 3, was 2)"
          [ "$n" = "3" ] || { echo "[-] cpuset.c guard patch did not apply"; exit 1; }
          perl -0777 -ne 'exit(index($_,"return cpuset_write_resmask(of, tgt.cpus, nbytes, off);\n}\n#endif")>=0?0:1)' kernel/cpuset.c || { echo "[-] cpuset.c #endif is not right after the helper"; exit 1; }
          echo "=== Kbuild.include __cc-option after patch ==="
          grep -n '__cc-option' scripts/Kbuild.include | head -5
          {
            echo ''
            echo '# ---- dean26 diagnostic (read-only, added by mk_dean26.py) ----'
            echo 'prepare-compiler-check: dean26-diag'
            echo 'dean26-diag:'
            printf '\t@echo "DIAG-BEGIN"\n'
            printf '\t@echo "DIAG: cc-name=[$(cc-name)] CC=[$(CC)]"\n'
            printf '\t@echo "DIAG: stackp-name=[$(stackp-name)] stackp-flag=[$(stackp-flag)]"\n'
            printf '\t@echo "DIAG: KBUILD_CPPFLAGS=[$(KBUILD_CPPFLAGS)]"\n'
            printf '\t@echo "DIAG: CC_OPTION_CFLAGS=[$(CC_OPTION_CFLAGS)]"\n'
            printf '\t@echo "DIAG: KBUILD_CFLAGS=[$(KBUILD_CFLAGS)]"\n'
            printf '\t@$(CC) -Werror $(KBUILD_CPPFLAGS) $(CC_OPTION_CFLAGS) -c -x c /dev/null -o /tmp/d26.o > /tmp/d26.err 2>&1; echo "DIAG: full-probe rc=$$?"; cat /tmp/d26.err\n'
            printf '\t@for t in $(KBUILD_CPPFLAGS) $(CC_OPTION_CFLAGS); do case "$$t" in -I*|-D*|-include) continue;; esac; $(CC) -Werror -Wno-error $$t -c -x c /dev/null -o /tmp/d26t.o > /tmp/d26t.err 2>&1 || { echo "DIAG-BADTOKEN=[$$t]"; cat /tmp/d26t.err; }; done\n'
            printf '\t@echo "DIAG-END"\n'
            echo '.PHONY: dean26-diag'
          } >> Makefile
          echo "=== Makefile tail ==="
          tail -16 Makefile

          # --- 7. FAIL FAST: run Kconfig here, before the real build -------
          echo "=== Kconfig self-check ==="
          rm -rf /tmp/kchk
          if make ARCH=arm64 O=/tmp/kchk defconfig > /tmp/kchk.log 2>&1; then
            echo "[+] defconfig OK"
          else
            echo "[-] defconfig FAILED"; tail -30 /tmp/kchk.log; exit 1
          fi
          if make ARCH=arm64 O=/tmp/kchk olddefconfig >> /tmp/kchk.log 2>&1; then
            echo "[+] olddefconfig OK"
          else
            echo "[-] olddefconfig FAILED"; tail -30 /tmp/kchk.log; exit 1
          fi
          echo "[-] remaining empty values: $(grep -c '^CONFIG_[A-Za-z0-9_]*=$' /tmp/kchk/.config || echo 0)"
          for k in LITTLE_CPU_MASK BIG_CPU_MASK KSU MODVERSIONS MODULE_SIG COMPAT_VDSO APPENDED_DTB_IMAGE DT_OVERLAY LOCALVERSION KALLSYMS STACKTRACE TRACING IPC_LOGGING SCHED_CORE_CTL; do
            echo "    $(grep -E "^#? ?CONFIG_${k}[= ]" /tmp/kchk/.config | head -1)"
          done
          echo "[i] INIT_STACK choice resolution in the generated .config:"
          grep -E "^(# )?CONFIG_INIT_STACK" /tmp/kchk/.config || true
          echo "[i] SECCOMP (SukiSU app_profile.c needs it) in the generated .config:"
          grep -E "^CONFIG_(SECCOMP|SECCOMP_FILTER|HAVE_ARCH_SECCOMP_FILTER)=" /tmp/kchk/.config || true
          grep -q '^CONFIG_SECCOMP=y' /tmp/kchk/.config || {
            echo "[-] CONFIG_SECCOMP did not survive the defconfig merge - SukiSU cannot build"
            grep -n 'SECCOMP' /tmp/kchk/.config | head
            exit 1; }
          echo "[+] CONFIG_SECCOMP=y survived"

          echo "[i] crash-forensics options in the generated .config:"
          grep -E "^(# )?CONFIG_(PANIC_TIMEOUT|PSTORE|PSTORE_RAM|PSTORE_CONSOLE|PSTORE_PMSG|QCOM_FORCE_WDOG_BITE_ON_PANIC|DEBUG_KERNEL|QCOM_MEMORY_DUMP_V2)[= ]" /tmp/kchk/.config || true
          grep -q '^CONFIG_PANIC_TIMEOUT=5' /tmp/kchk/.config || {
            echo "[-] CONFIG_PANIC_TIMEOUT=5 did not survive - forensics would be lost"
            exit 1; }
          grep -q '^CONFIG_PSTORE=y' /tmp/kchk/.config || {
            echo "[-] CONFIG_PSTORE=y did not survive - forensics would be lost"
            exit 1; }
          grep -q '^CONFIG_PSTORE_CONSOLE=y' /tmp/kchk/.config || {
            echo "[!] CONFIG_PSTORE_CONSOLE=y vanished (console capture unavailable)"; }
          grep -q 'CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC=y' /tmp/kchk/.config && {
            echo "[!] QCOM_FORCE_WDOG_BITE_ON_PANIC is still y - the PMIC may bite before pstore"
          } || echo "[+] QCOM_FORCE_WDOG_BITE_ON_PANIC is off"
          # dean26 hard gate: DEBUG_KERNEL=y breaks drivers/platform/msm/gsi
          grep -q '^CONFIG_DEBUG_KERNEL=y' /tmp/kchk/.config && {
            echo "[-] CONFIG_DEBUG_KERNEL is y - gsi.c:3190 cannot compile"
            exit 1; } || echo "[+] CONFIG_DEBUG_KERNEL is off (gsi.c stays compilable)"
          echo "[+] crash forensics armed"
          echo "[i] stock-matching overrides in the generated .config:"
          grep -E "^(# )?CONFIG_(PANIC_TIMEOUT|QCOM_MEMORY_DUMP_V2|CPU_BOOST|SCHED_SMT|SCHED_CORE_ROTATE|PM_AUTOSLEEP|CGROUP_SCHED|FAIR_GROUP_SCHED|RT_GROUP_SCHED|SCHED_AUTOGROUP)=" /tmp/kchk/.config || true

      - name: 32-bit host libs for the AOSP gcc-4.9 prebuilt
        if: always()
        continue-on-error: true
        run: |
          set -x
          G64="$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android-gcc"
          file "$G64" || true
          if file "$G64" | grep -q "ELF 32-bit"; then
            echo "[+] 32-bit host binary -> installing i386 runtime"
            sudo dpkg --add-architecture i386 || true
            sudo apt-get update -qq || true
            sudo apt-get install -y --no-install-recommends libc6:i386 libstdc++6:i386 zlib1g:i386 || true
          else
            echo "[+] not a 32-bit binary"
          fi

      - name: Cross-compiler self-test (cc-option root cause)
        if: always()
        continue-on-error: true
        run: |
          echo "GCC_64=$GCC_64"
          echo "GCC_32=$GCC_32"
          export "$GCC_64" || true
          export "$GCC_32" || true
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          CCX="${CROSS_COMPILE}gcc"
          echo "CCX=$CCX"
          ls -l "$CCX" || true
          file "$CCX" || true
          ldd "$CCX" 2>&1 | head -20 || true
          "$CCX" --version 2>&1 | head -3 || true
          echo "int main(void){return 0;}" > /tmp/t.c
          for f in none fno_stack fstack fstackstrong; do
            case $f in
              none) FLAGS="";;
              fno_stack) FLAGS="-fno-stack-protector";;
              fstack) FLAGS="-fstack-protector";;
              fstackstrong) FLAGS="-fstack-protector-strong";;
            esac
            out=$("$CCX" $FLAGS -c /tmp/t.c -o /tmp/t-$f.o 2>&1); rc=$?
            echo "FLAG[$f/$FLAGS] rc=$rc out=$out"
          done

          echo "--- kernel cc-option replica: CC -Werror <cppflags> <cflags> FLAG -c -x c /dev/null ---"
          for f in none fno_stack fstack fstackstrong; do
            case $f in
              none) FLAGS="";;
              fno_stack) FLAGS="-fno-stack-protector";;
              fstack) FLAGS="-fstack-protector";;
              fstackstrong) FLAGS="-fstack-protector-strong";;
            esac
            out=$("$CCX" -Werror $FLAGS -c -x c /dev/null -o /tmp/p-$f.o 2>&1); rc=$?
            echo "PROBE[$f/$FLAGS] rc=$rc out=$out"
          done
          echo "--- KBUILD_CFLAGS-ish line (arm64 gcc-4.9 style) ---"
          KFLAGS="-Wall -Wundef -Wstrict-prototypes -Wno-trigraphs -fno-strict-aliasing -fno-common -fshort-wchar -Werror-implicit-function-declaration -Wno-format-security -std=gnu89 -mgeneral-regs-only -fno-PIE"
          for f in none fstack fstackstrong; do
            case $f in
              none) FLAGS="";;
              fstack) FLAGS="-fstack-protector";;
              fstackstrong) FLAGS="-fstack-protector-strong";;
            esac
            out=$("$CCX" -Werror $KFLAGS $FLAGS -c -x c /dev/null -o /tmp/k-$f.o 2>&1); rc=$?
            echo "KPROBE[$f/$FLAGS] rc=$rc out=$out"
          done
          echo "--- same, but a real source file instead of /dev/null ---"
          out=$("$CCX" -Werror $KFLAGS -fstack-protector-strong -c /tmp/t.c -o /tmp/k-file.o 2>&1); rc=$?
          echo "KPROBE[file] rc=$rc out=$out"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process
        env:
          LOCALVERSION: ""

      - name: 📋 Dump effective kernel config + module ABI
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          cp device_kernel/out/.config kunlun2_dean27noksu.config 2>/dev/null || echo "no .config"
          find device_kernel/out -name '*.ko' 2>/dev/null | sort > kunlun2_dean15_modules.txt || true
          echo "[+] .ko count: $(wc -l < kunlun2_dean15_modules.txt)"
          echo "=== TOOLCHAIN identity (GCC or clang?) ==="
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          which aarch64-linux-android-gcc 2>/dev/null && aarch64-linux-android-gcc --version | head -2 || echo "(gcc not on PATH)"
          which clang 2>/dev/null | head -1 || true
          echo "=== config check ==="
          grep -E '^CONFIG_MODULES=|^CONFIG_MODULE_SIG|^CONFIG_MODVERSIONS|^CONFIG_LOCALVERSION|^CONFIG_KSU|COMPAT_VDSO|APPENDED_DTB|DT_OVERLAY|^CONFIG_KALLSYMS|^CONFIG_STACKTRACE=|^CONFIG_TRACING=|^CONFIG_IPC_LOGGING|^CONFIG_SCHED_CORE_CTL|^CONFIG_DVB_MPQ|^CONFIG_CC_STACKPROTECTOR=|LITTLE_CPU_MASK|BIG_CPU_MASK' kunlun2_dean27noksu.config || true
          echo "=== kernel release ==="
          cat device_kernel/out/include/config/kernel.release 2>/dev/null || cat device_kernel/include/config/kernel.release 2>/dev/null || echo "(no kernel.release)"
          echo "=== VERMAGIC actually compiled into Image ==="
          ls -la device_kernel/out/arch/arm64/boot/ 2>/dev/null | head
          grep -a -o -m1 '4\.9\.[0-9][^ ]* SMP [ -~]*mod_unload[ -~]*' device_kernel/out/arch/arm64/boot/Image 2>/dev/null || echo "(no Image yet)"
          echo "=== compiler that actually produced .o files ==="
          grep -a -o -m3 'GCC: (GNU) [0-9][^)]*)' device_kernel/out/arch/arm64/boot/Image 2>/dev/null || true
          grep -a -o -m3 'clang version [0-9][^)]*)' device_kernel/out/arch/arm64/boot/Image 2>/dev/null || true
          echo "=== error.log (if any) ==="
          for f in $GITHUB_WORKSPACE/error.log device_kernel/error.log; do
            if [ -f "$f" ]; then echo "[$f]"; grep -n -E 'fatal error:|error:|Error [0-9]|No rule to make' "$f" | head -80; fi
          done
          echo "=== Module.symvers ==="
          find device_kernel -name Module.symvers -exec cp {} "$GITHUB_WORKSPACE/kunlun2_dean15-symvers.txt" \; 2>/dev/null || true
          wc -l "$GITHUB_WORKSPACE/kunlun2_dean15-symvers.txt" 2>/dev/null || true

      - name: 📤 Upload config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunlun2-dean27noksu-config
          path: |
            kunlun2_dean27noksu.config
            kunlun2_dean15_modules.txt
            kunlun2_dean15-symvers.txt
          if-no-files-found: warn

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
