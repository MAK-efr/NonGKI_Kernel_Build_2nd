name: Build Xiaomi Mi 9 SE (grus, LineageOS 22.2 A15)

# ============================================================================
# 目标: 在 LineageOS 22.2 官方 sdm710 内核树 (4.9.337) 上集成 SukiSU Ultra + SUSFS
#
# 为什么换掉 MIUI 版 (build-xiaomi-grus-miui12-a11.yml):
#   MIUI 时代用第三方 Gah0/grus-r 树 (4.9.227)，与 MIUI 闭源 vendor 二进制
#   不匹配 -> 纯 stock 无 KSU 也死机。现系统已换 LineageOS 22.2，
#   内核与 vendor 同源 (都是 LineageOS 出的)，死因消除。
#
# 关键差异 (相对 MIUI 版):
#   1. KERNEL_SOURCE  -> LineageOS/android_kernel_xiaomi_sdm710 @ lineage-22.2
#   2. defconfig      -> 设备 /proc/config.gz 提取的实配 (=官方配置, vermagic 一致)
#   3. patch-no-kprobe -> 真正执行 (MIUI 版退化成 echo，疑为漏掉的关键步骤)
#   4. 删除所有针对 Gah0/grus-r 树缺陷的补丁 (LOS 官方树不需要)
#
# 触发: 本文件变更时自动 push 构建 (本机无法直连 api.github.com 做 dispatch)
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [mainline]
    paths: ['.github/workflows/build-xiaomi-grus-los222.yml']

env:
  # Device env
  DEVICE_NAME: "xiaomi_grus"
  DEVICE_CODENAME: "grus"

  # 内核 Makefile 在 clang + aarch64-linux-android- 前缀下强制要求 CLANG_TRIPLE
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # ---- 内核源: LineageOS 官方 sdm710 树 (与设备 vendor 同源) ----
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_xiaomi_sdm710.git"
  KERNEL_BRANCH: "lineage-22.2"

  # 工具链: 与工厂 pixel3a-lineageos22 模板一致
  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  # defconfig 由 "Extra Kernel Options" 步骤从仓库内文件写入，
  # 不走工厂的 URL 下载 (GitHub raw 在本机/CI 不可靠)。
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "grus_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"   # SukiSU-Ultra, 分支自动用 builtin

  # SUSFS: THREAD_INFO_IN_TASK=y 已满足依赖 (见设备 config)
  SUSFS_ENABLE: true
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lineageos22_2_a15"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  # false: 不覆盖 /vendor 下原厂 9 个 .ko。自编内核 vermagic=4.9.337-perf+ 与官方
  # 一致，原厂模块仍可加载。若改 true 有模块/vendor HAL 不匹配风险。
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # 设备内核无 CONFIG_KPROBES -> 只能走 syscall manual hook
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"        # CONFIG_KPROBES is not set -> KPM 不可用
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Mi 9 SE (grus, LineageOS 22.2 A15)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # ★ 关键: MIUI 版把这步退化成了 echo，导致 4.9 无 kprobes 的 syscall
      #   hook 修补从未执行。LOS 版恢复为真正调用。
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # ---- 1. 用设备实配 config 作 defconfig (vermagic 与官方一致) ----
          #     _defconfigs/grus_los222_defconfig 由 push_defconfig.py 从
          #     设备 /proc/config.gz 提取后推入本仓库。
          # 注意: 本步已 cd 到 $GITHUB_WORKSPACE/device_kernel,
          # 故 _defconfigs 必须用 $GITHUB_WORKSPACE 绝对路径 (不能用相对路径,
          # 否则会找不到文件并 fallback 到工厂 grus_stock_defconfig -> NR_CPUS 过大 -> 编译 #error)。
          CFG="$GITHUB_WORKSPACE/_defconfigs/grus_los222_defconfig"
          if [ ! -f "$CFG" ]; then
            echo "[-] FATAL: $CFG not found (defconfig missing) -> abort"
            exit 1
          fi
          cp "$CFG" ./arch/arm64/configs/grus_defconfig
          echo "--- defconfig head ---"
          head -n 5 ./arch/arm64/configs/grus_defconfig
          echo "--- sanity: CONFIG_ line count MUST be >= 1500 ---"
          CNT=$(grep -c '^CONFIG_' ./arch/arm64/configs/grus_defconfig)
          echo "CONFIG_ count = $CNT"
          if [ "$CNT" -lt 1500 ]; then
            echo "[-] FATAL: defconfig too small ($CNT lines) -> would silently degrade to factory default (NR_CPUS=64 -> sched.h:954 #error). Abort."
            exit 1
          fi
          echo "--- NR_CPUS (MUST be 8) ---"
          grep -n "CONFIG_NR_CPUS" ./arch/arm64/configs/grus_defconfig

          # ---- 2. 开启 KSU + 完整 SUSFS 子项 ----
          # 注意: 上面 cp 已覆盖 build-ready/patch-susfs 对 grus_defconfig 的
          # 追加, 故此处完整重建 KSU + SUSFS, 不可遗漏任一子项 (否则 SUSFS
          # 功能不会被编译进内核, 丧失"隐藏"能力)。
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "CONFIG_THREAD_INFO_IN_TASK=y"
            echo "CONFIG_NR_CPUS=8"
          } >> ./arch/arm64/configs/grus_defconfig

          # ---- 3. rodata/text 只读保护 (已删除) ----
          # 实测: LOS sdm710 树的 DEBUG_RODATA 是 def_bool y, 写 "is not set"
          # 会被 olddefconfig 丢弃; DEBUG_ALIGN_RODATA / DEBUG_SET_MODULE_RONX
          # 与 syscall 表无关。SukiSU Ultra 的 sukisu_ultra_fixed.patch 自行
          # 处理 text 段可写, 故此处不强行改 rodata (改了也无效, 反成噪音)。
          echo "[*] rodata lines intentionally omitted (LOS tree def_bool y + SukiSU self-patches)"

          tail -8 ./arch/arm64/configs/grus_defconfig

          # ---- 4. HOST TOOLS FIX (GCC >= 10, 4.9 树的 yylloc 多重定义) ----
          echo "[+] Allowing common symbols in host tools (-fcommon)"
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile

          # ---- 5. 修复 SukiSU builtin 在 4.9 上的适配缺口 ----
          # 5a. KSU_COMPAT_USE_STATIC_KEY 宏:
          #     kernel_compat.h:254 在 LINUX_VERSION_CODE>=4.3.0 定义它, 但
          #     feature/selinux_hide.c / feature/sucompat.c 用 #ifdef 包裹函数定义
          #     却未 include 该头 -> 编译单元内宏未定义 -> 函数整段被排除 -> 链接
          #     undefined。4.9 有 jump_label (DEFINE_STATIC_KEY_TRUE), 强制宏安全。
          #     直接在相关 .c 顶部注入宏定义 (上一轮已验证此路可使 selinux_hide.c /
          #     sucompat.c 定义编译进内核)。
          grep -rl "KSU_COMPAT_USE_STATIC_KEY" drivers/kernelsu --include='*.c' 2>/dev/null | while read -r f; do
            if ! grep -q "define KSU_COMPAT_USE_STATIC_KEY" "$f"; then
              sed -i '1i #define KSU_COMPAT_USE_STATIC_KEY' "$f"
              echo "[+] forced KSU_COMPAT_USE_STATIC_KEY in $f"
            fi
          done

          # 5b. current_sid 内核侧: 4.9 是 static inline (security/selinux/hooks.c:217,
          #     不在 security.h 声明), 其他编译单元无法链接/看到。改为普通全局函数
          #     + EXPORT_SYMBOL, 供 KSU 外部链接 (上一轮已验证生效)。
          sed -i 's/static inline u32 current_sid(void)/u32 current_sid(void)/' security/selinux/hooks.c
          grep -q "EXPORT_SYMBOL(current_sid);" security/selinux/hooks.c || printf '\nEXPORT_SYMBOL(current_sid);\n' >> security/selinux/hooks.c

          # 5c. KSU 侧 current_sid 无声明: 各 KSU .c 直接调用 current_sid(),
          #     但内核 security.h/objsec.h 都不声明它 (4.9 仅 static inline 在
          #     hooks.c, KSU_COMPAT_HAS_CURRENT_SID 因此未定义) -> implicit declaration。
          #     ⚠️ 上一轮硬编码 drivers/kernelsu/kernel/selinux/selinux.c 多了一层
          #     kernel/ (实际路径无此层), [ -f ] 为 false 直接跳过, 原型没注入。
          #     改为 grep -rl 自动定位所有引用文件, 顶部补 extern (不依赖路径)。
          grep -rl "current_sid" drivers/kernelsu --include='*.c' 2>/dev/null | while read -r f; do
            if ! grep -q "extern u32 current_sid" "$f"; then
              sed -i '1i extern u32 current_sid(void);' "$f"
              echo "[+] extern current_sid -> $f"
            fi
          done

          # 5d. ksud.c 调用 ksu_selinux_hide_* 系列但不 include selinux_hide.h
          #     (原型在 .h 里被 #ifdef KSU_COMPAT_USE_STATIC_KEY 守卫, 调用方看不到)
          #     -> implicit declaration。同样用 grep -rl 自动定位, 顶部补原型。
          PROTOS='void ksu_selinux_hide_handle_second_stage(void); void ksu_selinux_hide_handle_post_fs_data(void); void ksu_selinux_hide_drop_backup_if_unused(void); void ksu_selinux_hide_init(void); void ksu_selinux_hide_exit(void);'
          grep -rl "ksu_selinux_hide_handle" drivers/kernelsu --include='*.c' 2>/dev/null | while read -r f; do
            if ! grep -q "ksu_selinux_hide_handle_second_stage(void)" "$f"; then
              sed -i "1i $PROTOS" "$f"
              echo "[+] selinux_hide prototypes -> $f"
            fi
          done

          # 5e. 4.9 不编译 selinux_hide 子系统: ksu.c:84 用
          #     '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5,10,0)' 守卫
          #     #include "feature/selinux_hide.c", 4.9 (<5.10) 整段排除; 但
          #     ksud.c 无条件调用 ksu_selinux_hide_handle_* (57/219/291 行无守卫)
          #     -> 链接 undefined。改该 #if 加 #else 分支, 提供 5 个空 stub
          #     (签名匹配 feature/selinux_hide.h 原型), 4.9 链接通过
          #     (selinux hide 功能在 4.9 不可用, 但 root 核心不受影响)。
          KSU_MAIN=$(grep -rl '#include "feature/selinux_hide.c"' drivers/kernelsu --include='*.c' | head -1)
          if [ -n "$KSU_MAIN" ]; then
            perl -0pi -e 's{\Q#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\E\n\Q#include "feature/selinux_hide.c"\E\n\Q#endif\E}{#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include "feature/selinux_hide.c"\n#else\nvoid ksu_selinux_hide_handle_second_stage(void) {}\nvoid ksu_selinux_hide_handle_post_fs_data(void) {}\nvoid ksu_selinux_hide_drop_backup_if_unused(void) {}\nvoid ksu_selinux_hide_init(void) {}\nvoid ksu_selinux_hide_exit(void) {}\n#endif}g' "$KSU_MAIN"
            echo "[+] 4.9 selinux_hide stubs added in $KSU_MAIN"
          else
            echo "[!] WARN: ksu.c not found, skip 5e"
          fi

          # 5f. ksu_handle_post_execveat_sucompat: 内核 fs/exec.c:1860 (SukiSU exec
          #     hook patch) 调用它, 但 SukiSU builtin 全树无此符号 (仅旧 KSU/GKI
          #     有, 已改名/重构) -> 4.9 链接 undefined。在 ksu.c 末尾追加同签名
          #     stub 返回 0 放行 (post-exec hook 在 4.9 非必需, su 兼容走主
          #     ksu_handle_execveat_sucompat)。
          if [ -n "$KSU_MAIN" ]; then
            printf '\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\nint ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) {\n    return 0;\n}\n#endif\n' >> "$KSU_MAIN"
            echo "[+] ksu_handle_post_execveat_sucompat stub added in $KSU_MAIN"
          fi

          # 5g. ARM64 重定位溢出 (vmlinux 链接期):
          #     `ksu_su_compat_enabled` 在 sucompat.c:4 定义为
          #     `bool ksu_su_compat_enabled __read_mostly = true;`。
          #     arch/arm64/include/asm/cache.h:35 ->
          #       #define __read_mostly __attribute__((__section__(".data..read_mostly")))
          #     该段被 arm64 vmlinux.lds.S:161 的 RO_DATA 收编, 位于 .text 之后
          #     的只读区。sdm710 内核庞大(含 qcacld 等巨型驱动),
          #     fs/built-in.o 的 .text 到 drivers/built-in.o 的 .data..read_mostly
          #     偏移超 ±2GB; 跨单元 READ_ONCE(ksu_su_compat_enabled) 用 32 位
          #     绝对寻址 -> `relocation truncated to fit: R_AARCH64_LDST32_ABS_LO12_NC`。
          #     (arm64 Makefile:108 -mcmodel=large 仅对模块生效, vmlinux 用 small model。)
          #     修法: 去 __read_mostly 让它进普通 .data 段(紧随 .text, 远在 2GB 内)。
          grep -rl "ksu_su_compat_enabled" drivers/kernelsu --include='*.c' 2>/dev/null | while read -r f; do
            sed -i 's/ksu_su_compat_enabled __read_mostly/ksu_su_compat_enabled/' "$f"
            echo "[+] dropped __read_mostly on ksu_su_compat_enabled in $f"
          done
          #     兜底: 其余 KSU __read_mostly 变量同样去属性, 避免同类溢出。
          grep -rl "__read_mostly" drivers/kernelsu --include='*.c' 2>/dev/null | while read -r f; do
            sed -i 's/[[:space:]]__read_mostly//g' "$f"
            echo "[+] stripped remaining __read_mostly in $f"
          done

          # 5i. ★ 2026-10-04 根因修复: 接上 4.9 的 setresuid -> ksu_install_fd 钩子
          #     根因 (源码 + 镜像字符串 + 设备实测 三方确证):
          #       builtin 树 drivers/kernelsu/kernel/hook/lsm_hook.c
          #         :19  #ifdef CONFIG_KSU_SUSFS
          #         :132 int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid)
          #         :149 #else  -> static int ksu_task_fix_setuid(...)
          #         :183 #ifndef CONFIG_KSU_SUSFS
          #         :184 LSM_HOOK_INIT(task_fix_setuid, ksu_task_fix_setuid),
          #         :185 #endif
          #       即 CONFIG_KSU_SUSFS=y 时 LSM task_fix_setuid 不注册, 且 builtin 树
          #       里没有任何人调用 ksu_handle_setresuid -> setuid 钩子彻底缺失 ->
          #       dmesg 永不出现 "install fd for manager: 10187" -> APP 的
          #       scan_driver_fd() 扫 /proc/self/fd 找不到 "[ksu_driver]" ->
          #       ksuctl 用 ioctl(-1) 得 EBADF -> get_info() 版本 0 -> 首页"不支持"。
          #       (CI 的 susfs_inline_hook_patches.sh:225-240 只对 maj<4 的内核插
          #        此钩子, 4.9 的 FIRST_VERSION=4 不满足 "<4", 整段被跳过。)
          #     修法: 抄上游 syscall_hook_patches.sh:348-349, 往 LOS kernel/sys.c
          #       的 setresuid 系统调用里插调用。锚点已核对存在:
          #         sys.c:585 SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)
          #         sys.c:591 kuid_t kruid, keuid, ksuid;
          #       插入点在 prepare_creds 之前, current_uid() 仍是旧 uid (zygote=0),
          #       正合 ksu_handle_setresuid 的 "cur_uid != 0 就早退" 保护。
          if grep -rq --include='*.c' --include='*.h' "ksu_handle_setresuid" drivers/kernelsu/ 2>/dev/null; then
            sed -i '/^SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)/i\#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n' kernel/sys.c
            sed -i '/kuid_t kruid, keuid, ksuid;/a\#ifdef CONFIG_KSU\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif\n' kernel/sys.c
            SRC_CNT=$(grep -c "ksu_handle_setresuid" kernel/sys.c || true)
            echo "[*] 5i: kernel/sys.c setresuid hook count=$SRC_CNT"
            if [ "$SRC_CNT" -lt 2 ]; then
              echo "[-] FATAL: 5i setresuid hook injection failed (count=$SRC_CNT) - abort to avoid a silent broken build"
              exit 1
            fi
            sed -n '583,597p' kernel/sys.c
          else
            echo "[-] FATAL: 5i ksu_handle_setresuid not found in drivers/kernelsu (SUSFS disabled? check CONFIG_KSU_SUSFS)"
            exit 1
          fi

          # 5j. ★★ 2026-10-04 第二轮修复: 5i 之后钩子仍未装 fd, 加 manager 快通道 + 诊断
          #     实测 (v3 内核, 07:19 构建, 已刷入并冷启 APP):
          #       dmesg 启动段有 "Cached zygote SID: 72" -> susfs_zygote_sid 已就绪;
          #       "install fd for manager" 计数仍为 0, 也完全没有 "Something wrong..."。
          #     => ksu_handle_setresuid() 在 sid 比较处静默 return 0 (setresuid 时该进
          #        程的 sid 已不是 u:r:zygote:s0), 与 Android 侧"先 setcon 再 setresuid"
          #        的顺序一致。故不再依赖 sid: 在 cur_uid==0 之后直接判 manager appid。
          LSM=$(find drivers/kernelsu -name 'lsm_hook.c' | head -1)
          echo "[*] 5j: LSM=$LSM"
          python3 - "$LSM" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          anchor = "    if (cur_uid != 0)\n        return 0;\n"
          assert s.count(anchor) == 1, ("anchor count", s.count(anchor))
          add = (
              '    pr_info("ksu_setresuid: ruid=%d cur=%d sid=%u zygote=%u next=%u\\n",\n'
              '            ruid, cur_uid, susfs_get_current_sid(), susfs_zygote_sid, susfs_zygote_next_sid);\n'
              '    if (likely(ksu_is_manager_appid_valid()) && unlikely(is_uid_manager(ruid))) {\n'
              '        disable_seccomp();\n'
              '        pr_info("install fd for manager (fastpath): %d\\n", ruid);\n'
              '        ksu_install_fd();\n'
              '        return 0;\n'
              '    }\n'
          )
          s = s.replace(anchor, anchor + add, 1)
          open(p, "w").write(s)
          k = s.count("install fd for manager (fastpath)")
          print("[*] 5j patched", p, "len", len(s), "fastpath_count", k)
          assert k == 1
          PYEOF
          grep -n -A9 "int ksu_handle_setresuid" "$LSM" | head -20

          echo "[+] KSU 4.9 fixes applied: current_sid export + KSU_COMPAT_USE_STATIC_KEY + selinux_hide prototypes + 4.9 stubs + no __read_mostly + 5i setresuid hook + 5j manager fastpath"

          # ---- 6. 版本字符串: 不写 .scmversion ----
          #     官方内核 vermagic = 4.9.337-perf+ 的 "+" 来自编译时 dirty tree
          #     (KSU/SUSFS patch 改动了源码)。写 .scmversion 会覆盖成
          #     -g<hash>, 破坏与 /vendor 下 9 个预编译 .ko 的 vermagic 一致
          #     性, 导致模块加载失败。故留空, 让 setlocalversion 自然生成 "+"。

      # ---- 以下 patch 步骤保持工厂默认 (不启用时不生效) ----
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
