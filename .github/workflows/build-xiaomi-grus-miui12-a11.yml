name: Build Xiaomi Mi 9 SE (grus, MIUI 12.5 A11)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "xiaomi_grus"
  DEVICE_CODENAME: "grus"

  # 内核 Makefile 在 clang + aarch64-linux-android- 前缀下强制要求 CLANG_TRIPLE，
  # 不设就报 "Clang with Android --target detected. Did you specify CLANG_TRIPLE?"。
  # 官方 build-google-pixel-3a-lineageos22-a15.yml 用的就是这两行。
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # Gah0/android_xiaomi_kernel_grus branch grus-r = Linux 4.9.227, exactly matching
  # the running stock kernel (4.9.227-perf-g4e7b1e0) of this MIUI 12.5 device.
  KERNEL_SOURCE: "https://github.com/Gah0/android_xiaomi_kernel_grus.git"
  KERNEL_BRANCH: "grus-r"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  # Deliberately empty: the factory path for DEFCONFIG_SOURCE resolves to a nested
  # device_kernel/device_kernel/... path. We overwrite the defconfig in our own step instead.
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "grus_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "miui12_a11"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "true"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # Device config has no CONFIG_KPROBES -> manual syscall hook.
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Mi 9 SE (grus, MIUI 12.5 A11)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        run: |
          echo "no CONFIG_KPROBES in this kernel -> syscall hook only"

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Use the device's own /proc/config.gz as the defconfig.
          # Edits applied while generating it:
          #   CONFIG_MODULE_SIG_FORCE=n  (stock vendor .ko must keep loading)
          #   CONFIG_LOCALVERSION="-perf-g4e7b1e0" + LOCALVERSION_AUTO=n
          #     -> identical vermagic to the stock kernel
          curl -sSL "https://raw.githubusercontent.com/MAK-efr/NonGKI_Kernel_Build_2nd/mainline/_defconfigs/grus_stock_defconfig" -o ./arch/arm64/configs/grus_defconfig
          echo "--- defconfig head ---"
          head -n 5 ./arch/arm64/configs/grus_defconfig
          echo "--- sanity ---"
          grep -c '^CONFIG_' ./arch/arm64/configs/grus_defconfig

          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/grus_defconfig
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> ./arch/arm64/configs/grus_defconfig
          # --- SUSFS must REALLY be off ---
          # The factory's "Set KSU and SUSFS for DEFCONFIG" step appends
          #   CONFIG_KSU_SUSFS=n
          # but kconfig silently ignores that spelling; only
          # "# CONFIG_X is not set" actually turns a symbol off. Without it
          # SukiSU's kernel/Kconfig (config KSU_SUSFS / default y) leaves SUSFS
          # ENABLED, so kernel_includes.h:77 pulls in the nonexistent header:
          #   drivers/kernelsu/kernel_includes.h:77: fatal error:
          #   'linux/susfs.h' file not found
          echo "[+] Explicitly disabling CONFIG_KSU_SUSFS"
          echo "# CONFIG_KSU_SUSFS is not set" >> ./arch/arm64/configs/grus_defconfig
          tail -4 ./arch/arm64/configs/grus_defconfig

          sed -i 's/^static DEFINE_RWLOCK(policy_rwlock);$/DEFINE_RWLOCK(policy_rwlock);/' security/selinux/ss/services.c
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile

          # --- HOST TOOLS FIX (GCC >= 10) ---
          # This 4.9 tree relies on pre-GCC-10 tentative-definition merging for
          # dtc's yylloc. Ubuntu runners ship GCC >= 10 where -fno-common is the
          # default, so linking scripts/dtc-aosp/dtc-aosp dies with:
          #   multiple definition of `yylloc'  (dtc-parser.tab.o vs dtc-lexer.lex.o)
          # HOSTCFLAGS feeds KBUILD_HOSTCFLAGS in 4.9; set both to be safe.
          echo "[+] Allowing common symbols in host tools (-fcommon)"
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile

          # --- SukiSU builtin sulog bug ---
          # With CONFIG_KSU_SUSFS *unset*, the in-tree ksu_sulog_capture()
          # takes `const struct user_arg_ptr argv` BY VALUE (event.c:289), while
          # this tree also defines USER_ARG_NULL as a POINTER:
          #   event.c:379  ksu_sulog_capture(... USER_ARG_NULL, gfp);
          # clang: passing 'struct user_arg_ptr *' to parameter of incompatible
          # type 'struct user_arg_ptr'; dereference with *
          # Dereference AT THE CALL SITE so this works no matter which variant
          # of USER_ARG_NULL the fetched SukiSU tree carries
          # (user_arg_null_ptr() or (&(struct user_arg_ptr){ 0 })).
          # Harmless: GRANT_ROOT sets should_skip_copy and never reads argv.
          echo "[+] Fixing SukiSU sulog USER_ARG_NULL for non-SUSFS build"
          sed -i 's/USER_ARG_NULL, gfp)/*(USER_ARG_NULL), gfp)/' drivers/kernelsu/sulog/event.c
          grep -n "USER_ARG_NULL" drivers/kernelsu/sulog/event.c || true

          # --- grus-r is missing drivers/input/touchscreen/xiaomi/ ---
          # Every OTHER branch of Gah0/android_xiaomi_kernel_grus has that dir;
          # grus-r does not, yet tp_goodix_driver/goodix_ts_i2c.c:31 includes
          # "../xiaomi/xiaomi_touch.h" unconditionally ->
          #   fatal error: ../xiaomi/xiaomi_touch.h: No such file or directory
          # Every *use* of it sits inside #ifdef CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE,
          # which this tree cannot even select (its Kconfig is gone too) -> stub is enough.
          echo "[+] Stubbing the xiaomi_touch.h that grus-r forgot"
          mkdir -p drivers/input/touchscreen/xiaomi
          printf '#ifndef __XIAOMI__TOUCH_H\n#define __XIAOMI__TOUCH_H\n#endif\n' > drivers/input/touchscreen/xiaomi/xiaomi_touch.h
          ls -l drivers/input/touchscreen/xiaomi/xiaomi_touch.h

          # --- grus-r also dropped tp_goodix_driver/test_core/ ---
          # Its (commented-out) Makefile line shows the original build used
          #   ... goodix_ts_tools.o test_core/
          # and goodix_ts_core.c still calls test_process()/get_tp_rawdata()/
          # get_tp_testcfg() from there (calls at :707/:747/:795/:2357) ->
          #   undefined reference to `test_process'
          # Only reachable from the tp_test / tp_rawdata / tp_get_testcfg sysfs
          # test-tool entry points, never from the normal touch path, so no-op
          # stubs keep touch working and only disable the factory test tooling.
          # IMPORTANT: do NOT append these to goodix_ts_core.h -- that header
          # has an include guard (#ifndef _GOODIX_TS_CORE_H_ at :21) and an
          # append lands AFTER its #endif, so the second include of the header
          # (goodix_ts_i2c.c:28 -> goodix_cfg_bin.h:4 -> goodix_ts_core.h)
          # re-parses them and clang errors with
          #   goodix_ts_core.h:813:19: error: redefinition of 'test_process'
          # So prepend them to goodix_ts_core.c instead: single TU, defined
          # before the call sites.
          echo "[+] Stubbing Goodix test_core entry points"
          GC=c drivers/input/touchscreen/tp_goodix_driver/goodix_ts_core.c
          if [ -f "$GC" ] && ! grep -q 'int test_process(void \*dev)' "$GC"; then
            printf '/* grus-r dropped test_core/ but goodix_ts_core.c still calls these */\nstatic inline int test_process(void *dev) { return 0; }\nstatic inline int get_tp_rawdata(void *dev, char *buf, int *buf_size) { return 0; }\nstatic inline int get_tp_testcfg(void *dev, char *buf, int *buf_size) { return 0; }\n' > /tmp/gtstub.txt
            cat /tmp/gtstub.txt "$GC" > /tmp/gtstub.c
            mv /tmp/gtstub.c "$GC"
            head -5 "$GC"
          fi

          # --- grus-r standalone DTBs cannot build ---
          # grus-sdm710.dtsi:465/469 reference &smb1355_0 / &smb1355_1, which
          # only exist in the full grus.dts overlay ->
          #   grus-sdm710.dtsi:465.1-11 Label or path smb1355_0 not found
          #   FATAL ERROR: Syntax error parsing input tree
          # Do NOT switch on CONFIG_BUILD_ARM64_DT_OVERLAY: that branch also
          # wants a dtbo.img, and this tree's scripts/dtbTool is a python2
          # script (runner has no python2) ->
          #   /bin/sh: 1: python2: not found  (arch/arm64/boot/Makefile:73)
          # The kernel's DTB is unused anyway: repack_boot.py keeps the stock
          # dtb block from the phone's own boot image. So just empty the two
          # broken targets out of the else-branch list.
          echo "[+] Neutering the two unbuildable grus DTBs"
          sed -i -e 's|^\(\s*\)grus-sdm710\.dtb *\\$|\1|' -e 's|^\(\s*\)grus-sdm712\.dtb$|\1|' arch/arm64/boot/dts/qcom/Makefile
          sed -n '112,126p' arch/arm64/boot/dts/qcom/Makefile

          # --- SukiSU builtin non-GKI selinux_hide bug ---
          # kernel/ksu.c only pulls in feature/selinux_hide.c when
          #   #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
          # but runtime/ksud.c calls three of its functions unconditionally
          # (ksud.c:57, :95, :219/:291). On this 4.9 tree the final vmlinux link
          # therefore fails with:
          #   undefined reference to 'ksu_selinux_hide_handle_second_stage'
          #   undefined reference to 'ksu_selinux_hide_handle_post_fs_data'
          # Provide empty inlines for < 5.10; the real ones still win on >= 5.10.
          # NOTE: it is NOT enough to patch feature/selinux_hide.h -- ksu.c
          # guards the *header* include too (ksu.c:33-35). So put the stubs in
          # kernel_includes.h, which ksu.c:1 pulls in unconditionally and which
          # already includes <linux/version.h> (line 72).
          echo "[+] Adding <5.10 stubs for SukiSU selinux_hide"
          if [ -f drivers/kernelsu/kernel_includes.h ]; then
            grep -q 'ksu_selinux_hide_handle_post_fs_data(void) {}' drivers/kernelsu/kernel_includes.h || \
              printf '\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\nstatic inline void ksu_selinux_hide_init(void) {}\nstatic inline void ksu_selinux_hide_exit(void) {}\nstatic inline void ksu_selinux_hide_drop_backup_if_unused(void) {}\nstatic inline void ksu_selinux_hide_handle_second_stage(void) {}\nstatic inline void ksu_selinux_hide_handle_post_fs_data(void) {}\n#endif\n' >> drivers/kernelsu/kernel_includes.h
            tail -9 drivers/kernelsu/kernel_includes.h
          fi

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files