name: Build Lenovo Z6 Lite / K10 Note (kunlun2) - DEAN SukiSU

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "lenovo_kunlun2"
  DEVICE_CODENAME: "kunlun2"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # deanlancer/msm-4.9-kunlun2 @ android-s -- a kunlun2 tree that already ships
  # the old manual-hook KernelSU driver in drivers/kernelsu.  The previous run
  # forced CONFIG_KSU=n while the factory still injected hooks, so the final
  # vmlinux link died on:
  #   undefined reference to `ksu_handle_input_handle_event'
  #   undefined reference to `ksu_handle_faccessat'
  #   undefined reference to `ksu_handle_stat'
  #   undefined reference to `ksu_handle_execveat'
  # This run keeps KernelSU ON (mirrors the stock_a10 SukiSU flavour).
  KERNEL_SOURCE: "https://github.com/deanlancer/msm-4.9-kunlun2.git"
  KERNEL_BRANCH: "android-s"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "kunlun2_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "dean_sukisu"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "true"

  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Lenovo kunlun2 DEAN + SukiSU
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Silence the very chatty 4.9 tree
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile

          # HOST TOOLS FIX (GCC >= 10): 4.9's scripts/dtc-aosp relies on
          # pre-GCC-10 tentative-definition merging for yylloc.
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile

          # DTB: skip the whole dtbs target (stock dtb section is what we use)
          sed -i 's/^KBUILD_DTBS.*/KBUILD_DTBS :=/' arch/arm64/Makefile
          grep -n '^KBUILD_DTBS' arch/arm64/Makefile || true

          # KernelSU MUST stay on for this tree: the factory's build-ready step
          # already appended "CONFIG_KSU=y"; we only make sure it is the LAST
          # KSU assignment so kconfig cannot inherit an older "# CONFIG_KSU is
          # not set" line.  (The stock_a10 SukiSU flavour does the same.)
          echo "CONFIG_KSU=y" >> arch/arm64/configs/kunlun2_defconfig
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> arch/arm64/configs/kunlun2_defconfig
          echo "# CONFIG_KSU_SUSFS is not set" >> arch/arm64/configs/kunlun2_defconfig
          grep -n 'CONFIG_KSU' arch/arm64/configs/kunlun2_defconfig || true

          # 32-bit vDSO fix: vdso32/Makefile uses  $(CC) --target=arm32 -no-integrated-as
          # while CROSS_COMPILE_ARM32 is empty on this runner, so clang falls back to the
          # host /usr/bin/as which rejects '-EL'.  arch/arm64/Makefile gates the whole
          # vdso32 build on CONFIG_VDSO32, which is only set when CONFIG_COMPAT_VDSO=y,
          # so turning COMPAT_VDSO off drops vdso32 entirely (32-bit app compat stays).
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/kunlun2_defconfig
          grep -n 'COMPAT_VDSO' arch/arm64/configs/kunlun2_defconfig || true

          # --- SukiSU builtin sulog bug (same fix as the stock_a10 flavour) ---
          # With CONFIG_KSU_SUSFS unset, drivers/kernelsu/sulog/event.c:379 calls
          # ksu_sulog_capture(..., USER_ARG_NULL, gfp) where USER_ARG_NULL expands
          # to a struct-not-pointer on this old tree.
          if [ -f drivers/kernelsu/sulog/event.c ]; then
            echo "[+] Fixing SukiSU sulog USER_ARG_NULL for non-SUSFS build"
            sed -i 's/USER_ARG_NULL, gfp)/*(USER_ARG_NULL), gfp)/' drivers/kernelsu/sulog/event.c
            grep -n "USER_ARG_NULL" drivers/kernelsu/sulog/event.c || true
          fi

          # --- SukiSU builtin non-GKI selinux_hide bug ---
          # drivers/kernelsu/kernel/ksu.c only includes feature/selinux_hide.c for
          # >= 5.10, but runtime/ksud.c calls its symbols unconditionally:
          #   undefined reference to `ksu_selinux_hide_handle_second_stage'
          #   undefined reference to `ksu_selinux_hide_handle_post_fs_data'
          # ksu.c:1 pulls in kernel_includes.h unconditionally, so the stubs go there.
          if [ -f drivers/kernelsu/kernel_includes.h ]; then
            echo "[+] Adding <5.10 stubs for SukiSU selinux_hide"
            grep -q 'ksu_selinux_hide_handle_post_fs_data(void) {}' drivers/kernelsu/kernel_includes.h || \
            printf '\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\nstatic inline void ksu_selinux_hide_init(void) {}\nstatic inline void ksu_selinux_hide_exit(void) {}\nstatic inline void ksu_selinux_hide_drop_backup_if_unused(void) {}\nstatic inline void ksu_selinux_hide_handle_second_stage(void) {}\nstatic inline void ksu_selinux_hide_handle_post_fs_data(void) {}\n#endif\n' >> drivers/kernelsu/kernel_includes.h
            tail -9 drivers/kernelsu/kernel_includes.h
          fi

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📋 Dump effective kernel config
        if: always()
        run: |
          cp device_kernel/out/.config "$GITHUB_WORKSPACE/kunlun2_dean2.config" 2>/dev/null || echo "no .config"
          find device_kernel/out -name '*.ko' 2>/dev/null | sort > "$GITHUB_WORKSPACE/kunlun2_dean2_modules.txt" || true
          echo "[+] .ko count: $(wc -l < "$GITHUB_WORKSPACE/kunlun2_dean2_modules.txt")"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODULE_SIG|^CONFIG_LOCALVERSION|^CONFIG_KSU|COMPAT_VDSO' "$GITHUB_WORKSPACE/kunlun2_dean2.config" || true

      - name: 📤 Upload config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunlun2-dean2-config
          path: |
            kunlun2_dean2.config
            kunlun2_dean2_modules.txt
          if-no-files-found: warn

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
