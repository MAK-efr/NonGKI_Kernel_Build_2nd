name: Build Xiaomi Mi 9 SE (grus, LineageOS 22.2 A15) KSU-only Baseline

# ============================================================================
# 目标: 在 LineageOS 22.2 官方 sdm710 内核树 (4.9.337) 上, 只集成 KernelSU
#       (SukiSU-Ultra), 不叠 SUSFS —— 先把"能开机的基线"立起来。
#
# 与 build-xiaomi-grus-los222.yml (KSU + SUSFS 版) 的差异, 只有三处:
#   1. SUSFS_ENABLE: false                (本版不 patch SUSFS)
#   2. defconfig 路径修正为绝对路径 + 硬失败 (上一版因相对路径找不到文件,
#      静默兜底成 13 行 defconfig -> NR_CPUS=64 -> sched.h #error 构建失败)
#   3. 不再关 rodata 保护 (DEBUG_RODATA 在 LOS 树里是 def_bool y, 不可配置;
#      另两项只影响对齐/模块内存, 对 syscall 表写入无用), 尽量减少与官方
#      config 的偏离, 一次只动一个变量。
#
# 上一版失败证据 (run 37172817496):
#   [-] _defconfigs/grus_los222_defconfig not found; fallback ...
#   --- sanity (should be ~1675) ---  13
#   ../include/trace/events/sched.h:954:2: error: "Unsupported NR_CPUS for lb tracepoint."
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [mainline]
    paths: ['.github/workflows/build-xiaomi-grus-los222-ksuonly.yml']

env:
  # Device env
  DEVICE_NAME: "xiaomi_grus"
  DEVICE_CODENAME: "grus"

  # 内核 Makefile 在 clang + aarch64-linux-android- 前缀下强制要求 CLANG_TRIPLE
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  # ---- 内核源: LineageOS 官方 sdm710 树 (与设备 vendor 同源) ----
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_xiaomi_sdm710.git"
  KERNEL_BRANCH: "lineage-22.2"

  # 工具链: 与工厂 pixel3a-lineageos22 模板一致 (clang r416183b)
  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  # defconfig 由 "Extra Kernel Options" 步骤从仓库内文件写入 (绝对路径),
  # 不走工厂的 URL 下载 (GitHub raw 不可靠)。
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "grus_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "sukisu"   # SukiSU-Ultra, 分支自动用 builtin

  # ★ 本版核心: 不叠 SUSFS
  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lineageos22_2_a15_ksuonly"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  # false: 不覆盖 /vendor 下原厂 .ko (自编内核 vermagic=4.9.337-perf+ 与官方一致)
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # 设备内核无 CONFIG_KPROBES -> 只能走 syscall manual hook
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"        # CONFIG_KPROBES is not set -> KPM 不可用
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Mi 9 SE (grus, LineageOS 22.2 A15) KSU-only Baseline
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      # SUSFS_ENABLE=false => 这个 composite action 内部每个 step 都被跳过 (无害),
      # 但 KernelSU 本体是由上一步 build-ready 的 KERNELSU_AUTO_GET 拉取的。
      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # ★ 4.9 无 kprobes 走 syscall hook, 这步必须真跑 (MIUI 版曾退化成 echo)
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/device_kernel

          # ---- 1. 用设备实配 config 作 defconfig (vermagic 与官方一致) ----
          # ★ 修正: 上一版写成相对路径 "_defconfigs/...", 而此处 cwd 已是
          #   device_kernel, 于是必然找不到, 又用 `|| true` 静默兜底, 最终
          #   defconfig 只有 13 行 -> make olddefconfig 用 Kconfig 默认值
          #   (LOS 树 NR_CPUS 默认 64) -> sched.h:954 #error -> 构建失败。
          #   现在: 绝对路径 + 找不到就硬失败, 不再有任何静默兜底。
          CFG="$GITHUB_WORKSPACE/_defconfigs/grus_los222_defconfig"
          if [ ! -f "$CFG" ]; then
            echo "##[error] defconfig not found: $CFG"
            ls -l "$GITHUB_WORKSPACE/_defconfigs" || true
            exit 1
          fi
          cp "$CFG" ./arch/arm64/configs/grus_defconfig
          echo "--- defconfig head ---"
          head -n 3 ./arch/arm64/configs/grus_defconfig
          N=$(grep -c '^CONFIG_' ./arch/arm64/configs/grus_defconfig)
          echo "--- defconfig CONFIG_ entries = $N (expect >= 1500) ---"
          if [ "$N" -lt 1500 ]; then
            echo "##[error] defconfig looks truncated ($N entries) - refusing to build with defaults"
            exit 1
          fi
          grep -E '^CONFIG_(NR_CPUS|SMP|MODULES|KALLSYMS)' ./arch/arm64/configs/grus_defconfig | sort

          # ---- 2. 只开 KSU (本版是 KSU-only 基线) ----
          #   注意: 上面 cp 覆盖了 build-ready / patch-susfs 往这个文件追加的内容,
          #   所以这里必须自己重建 (等价于 build-ready 的 "Set KSU and SUSFS for
          #   DEFCONFIG" 在 SUSFS_ENABLE=false 时的行为)。
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=n"
            echo "CONFIG_THREAD_INFO_IN_TASK=y"
            # 保险: 显式钉住 NR_CPUS=8, 防止任何情况下回落到 Kconfig 默认 64
            # (include/trace/events/sched.h:954 有 #if NR_CPUS > 32 #error ...)
            echo "CONFIG_NR_CPUS=8"
          } >> ./arch/arm64/configs/grus_defconfig

          # ---- 3. 不动 rodata 保护 (与上一版不同, 见文件头说明) ----
          #   LOS 树 arch/arm64/Kconfig: config DEBUG_RODATA -> def_bool y (无 prompt,
          #   写 "# CONFIG_DEBUG_RODATA is not set" 会被 olddefconfig 静默丢弃);
          #   DEBUG_ALIGN_RODATA / DEBUG_SET_MODULE_RONX 只影响对齐与模块内存,
          #   对 syscall 表 (核心 rodata) 无帮助。故本版保持官方原样。
          echo "[i] leaving rodata protections as official config"

          # ---- 4. HOST TOOLS FIX (GCC >= 10, 4.9 树的 yylloc 多重定义) ----
          echo "[+] Allowing common symbols in host tools (-fcommon)"
          echo "KBUILD_HOSTCFLAGS += -fcommon" >> Makefile
          echo "HOSTCFLAGS += -fcommon" >> Makefile

          # ---- 5. 抑制 4.9 树在新 clang 下的海量警告 ----
          sed -i '/KBUILD_CFLAGS   :=/s//& -w/' Makefile

          # ---- 6. 版本字符串: 不写 .scmversion ----
          #     让 setlocalversion 自然生成 "4.9.337-perf+" (与官方 vermagic 一致)。
          echo "--- final defconfig tail ---"
          tail -n 8 ./arch/arm64/configs/grus_defconfig

      # ---- 以下 patch 步骤保持工厂默认 (env 里 *_ENABLE=false, 不生效) ----
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
